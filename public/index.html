<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Solar Grid // P2P Settlement Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-void: #0D1117;
    --panel: #161D26;
    --panel-border: #26313D;
    --text-primary: #E8EDF2;
    --text-muted: #8B98A5;
    --amber: #E9A23B;
    --indigo: #5B7FE0;
    --slate: #4B5563;
    --usdc: #2775CA;
    --danger: #E0615B;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg-void);
    color: var(--text-primary);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    padding: 32px 20px 60px;
  }

  .wrap { max-width: 920px; margin: 0 auto; }

  header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 28px;
    border-bottom: 1px solid var(--panel-border);
    padding-bottom: 18px;
  }

  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 22px;
    letter-spacing: 0.02em;
    margin: 0;
  }

  h1 span { color: var(--text-muted); font-weight: 500; }

  .conn-status {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--slate);
  }
  .dot.live { background: var(--amber); box-shadow: 0 0 8px var(--amber); }

  .grid-row {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 16px;
    align-items: stretch;
    margin-bottom: 24px;
  }
  @media (max-width: 680px) {
    .grid-row { grid-template-columns: 1fr; }
    .flow-col { order: 2; padding: 8px 0; }
    .house.house-b { order: 3; }
  }

  .house {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 20px;
  }

  .house-label {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 13px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 4px;
  }

  .state-pill {
    display: inline-block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.05em;
    padding: 3px 10px;
    border-radius: 100px;
    margin-bottom: 16px;
  }
  .state-pill.surplus { background: rgba(233,162,59,0.15); color: var(--amber); }
  .state-pill.deficit { background: rgba(91,127,224,0.15); color: var(--indigo); }
  .state-pill.idle    { background: rgba(75,85,99,0.2); color: var(--text-muted); }

  .readout-row {
    display: flex;
    justify-content: space-between;
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    padding: 6px 0;
    border-bottom: 1px solid rgba(255,255,255,0.04);
  }
  .readout-row .label { color: var(--text-muted); }
  .readout-row .value { font-weight: 700; font-variant-numeric: tabular-nums; }

  .gauge {
    margin-top: 14px;
    height: 6px;
    border-radius: 3px;
    background: rgba(255,255,255,0.06);
    position: relative;
    overflow: hidden;
  }
  .gauge-fill {
    position: absolute; top: 0; bottom: 0;
    left: 50%;
    transition: width 0.4s ease, background 0.4s ease;
  }

  .flow-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-width: 90px;
    gap: 6px;
  }

  .flow-caption {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text-muted);
    text-align: center;
    letter-spacing: 0.03em;
    min-height: 14px;
  }

  .totals {
    display: flex;
    gap: 16px;
    margin-bottom: 24px;
  }
  .total-card {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 16px 20px;
  }
  .total-card .label {
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 6px;
  }
  .total-card .value {
    font-family: 'JetBrains Mono', monospace;
    font-size: 22px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .total-card.usdc .value { color: var(--usdc); }

  .log-panel {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 18px 20px;
  }
  .log-title {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 13px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 12px;
  }
  .log-empty {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--text-muted);
    padding: 12px 0;
  }
  .log-row {
    display: grid;
    grid-template-columns: 70px 60px 90px 90px 1fr;
    gap: 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
    padding: 7px 0;
    border-bottom: 1px solid rgba(255,255,255,0.04);
    animation: rowIn 0.3s ease;
  }
  .log-row .time { color: var(--text-muted); }
  .log-row .amount { color: var(--usdc); font-weight: 700; }
  .log-row .txid { color: var(--text-muted); text-align: right; }
  @keyframes rowIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }

  svg.flow-svg { width: 70px; height: 40px; overflow: visible; }
  .flow-line-bg { stroke: rgba(255,255,255,0.08); stroke-width: 2; fill: none; }
  .flow-pulse {
    stroke-width: 3;
    fill: none;
    stroke-dasharray: 10 220;
    stroke-dashoffset: 230;
    opacity: 0;
  }
  .flow-pulse.active {
    animation: flowRun 1.6s ease-in-out;
  }
  @keyframes flowRun {
    0%   { stroke-dashoffset: 230; opacity: 0; }
    10%  { opacity: 1; }
    90%  { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 0; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Solar Grid <span>// P2P Settlement Monitor</span></h1>
    <div class="conn-status"><span class="dot" id="connDot"></span><span id="connText">connecting…</span></div>
  </header>

  <div class="grid-row">
    <div class="house" id="houseA">
      <div class="house-label">House A</div>
      <div class="state-pill idle" id="pillA">IDLE</div>
      <div class="readout-row"><span class="label">Solar</span><span class="value" id="solarA">—</span></div>
      <div class="readout-row"><span class="label">Load</span><span class="value" id="loadA">—</span></div>
      <div class="readout-row"><span class="label">Net</span><span class="value" id="netA">—</span></div>
      <div class="gauge"><div class="gauge-fill" id="gaugeA"></div></div>
    </div>

    <div class="flow-col">
      <svg class="flow-svg" viewBox="0 0 70 40">
        <path class="flow-line-bg" d="M5,20 L65,20" />
        <path class="flow-pulse" id="flowAB" d="M5,14 L65,14" stroke="#E9A23B" />
        <path class="flow-pulse" id="flowBA" d="M65,26 L5,26" stroke="#5B7FE0" />
      </svg>
      <div class="flow-caption" id="flowCaption">watching for a trade…</div>
    </div>

    <div class="house house-b" id="houseB">
      <div class="house-label">House B</div>
      <div class="state-pill idle" id="pillB">IDLE</div>
      <div class="readout-row"><span class="label">Solar</span><span class="value" id="solarB">—</span></div>
      <div class="readout-row"><span class="label">Load</span><span class="value" id="loadB">—</span></div>
      <div class="readout-row"><span class="label">Net</span><span class="value" id="netB">—</span></div>
      <div class="gauge"><div class="gauge-fill" id="gaugeB"></div></div>
    </div>
  </div>

  <div class="totals">
    <div class="total-card">
      <div class="label">Energy Traded</div>
      <div class="value" id="totalKwh">0.000 kWh</div>
    </div>
    <div class="total-card usdc">
      <div class="label">USDC Settled</div>
      <div class="value" id="totalUsdc">$0.000000</div>
    </div>
    <div class="total-card">
      <div class="label">Trades</div>
      <div class="value" id="totalCount">0</div>
    </div>
  </div>

  <div class="log-panel">
    <div class="log-title">Settlement Log</div>
    <div id="logBody">
      <div class="log-empty">No trades yet — the first match will appear here.</div>
    </div>
  </div>

</div>

<script>
  const STATE_COLORS = { surplus: '#E9A23B', deficit: '#5B7FE0', idle: '#4B5563' };
  const els = {
    connDot: document.getElementById('connDot'),
    connText: document.getElementById('connText'),
    flowCaption: document.getElementById('flowCaption'),
    logBody: document.getElementById('logBody'),
    totalKwh: document.getElementById('totalKwh'),
    totalUsdc: document.getElementById('totalUsdc'),
    totalCount: document.getElementById('totalCount'),
  };

  function houseEls(node) {
    return {
      pill: document.getElementById('pill' + node),
      solar: document.getElementById('solar' + node),
      load: document.getElementById('load' + node),
      net: document.getElementById('net' + node),
      gauge: document.getElementById('gauge' + node),
    };
  }

  function renderNodeState(node, data) {
    const e = houseEls(node);
    const state = data.state || 'idle';
    e.pill.className = 'state-pill ' + state;
    e.pill.textContent = state.toUpperCase();

    if (typeof data.net_kw === 'number') {
      e.net.textContent = (data.net_kw >= 0 ? '+' : '') + data.net_kw.toFixed(2) + ' kW';
      const pct = Math.max(-100, Math.min(100, (data.net_kw / 3) * 100));
      e.gauge.style.width = Math.abs(pct) / 2 + '%';
      e.gauge.style.left = pct >= 0 ? '50%' : (50 + pct / 2) + '%';
      e.gauge.style.background = STATE_COLORS[state] || STATE_COLORS.idle;
    }
    if (typeof data.solar_kw === 'number') e.solar.textContent = data.solar_kw.toFixed(2) + ' kW';
    if (typeof data.load_kw === 'number') e.load.textContent = data.load_kw.toFixed(2) + ' kW';
    if (data.solar_kw === undefined) e.solar.textContent = '—';
    if (data.load_kw === undefined) e.load.textContent = '—';
  }

  function renderTotals(totals) {
    els.totalKwh.textContent = totals.kwhTraded.toFixed(3) + ' kWh';
    els.totalUsdc.textContent = '$' + totals.usdcSettled.toFixed(6);
    els.totalCount.textContent = totals.tradeCount;
  }

  function truncateTx(txId) {
    if (!txId || txId.length < 14) return txId || '—';
    return txId.slice(0, 6) + '…' + txId.slice(-4);
  }

  function prependTrade(trade) {
    if (els.logBody.querySelector('.log-empty')) els.logBody.innerHTML = '';
    const row = document.createElement('div');
    row.className = 'log-row';
    const time = new Date(trade.timestamp).toLocaleTimeString();
    row.innerHTML = `
      <span class="time">${time}</span>
      <span>${trade.from} → ${trade.to}</span>
      <span>${trade.kwh.toFixed(4)} kWh</span>
      <span class="amount">$${trade.amountUsdc.toFixed(6)}</span>
      <span class="txid">${truncateTx(trade.txId)}</span>`;
    els.logBody.prepend(row);
  }

  function playFlow(fromNode, toNode) {
    const pulseId = (fromNode === 'A' && toNode === 'B') ? 'flowAB' : 'flowBA';
    const el = document.getElementById(pulseId);
    el.classList.remove('active');
    void el.offsetWidth; // restart animation
    el.classList.add('active');
    els.flowCaption.textContent = `${fromNode} → ${toNode} settling…`;
    setTimeout(() => { els.flowCaption.textContent = 'watching for a trade…'; }, 1600);
  }

  function connect() {
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const ws = new WebSocket(proto + '//' + location.host);

    ws.onopen = () => {
      els.connDot.classList.add('live');
      els.connText.textContent = 'live';
    };
    ws.onclose = () => {
      els.connDot.classList.remove('live');
      els.connText.textContent = 'reconnecting…';
      setTimeout(connect, 1500);
    };
    ws.onerror = () => ws.close();

    ws.onmessage = (evt) => {
      const msg = JSON.parse(evt.data);

      if (msg.type === 'snapshot') {
        renderNodeState('A', msg.nodeState.A);
        renderNodeState('B', msg.nodeState.B);
        renderTotals(msg.totals);
        if (msg.recentTrades.length) {
          els.logBody.innerHTML = '';
          [...msg.recentTrades].reverse().forEach(prependTrade);
        }
      }

      if (msg.type === 'state') {
        renderNodeState(msg.node, msg);
      }

      if (msg.type === 'settlement') {
        renderTotals(msg.totals);
        prependTrade(msg.trade);
        playFlow(msg.trade.from, msg.trade.to);
      }
    };
  }

  connect();
</script>
</body>
</html>
